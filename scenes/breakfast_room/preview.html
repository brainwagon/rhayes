<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakfast Room Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #container { width: 100vw; height: 100vh; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
        }
        #info h2 { margin-bottom: 10px; font-size: 16px; }
        #info p { margin: 5px 0; opacity: 0.9; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 30px 50px;
            border-radius: 10px;
            font-size: 18px;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        <h2>Breakfast Room</h2>
        <p><strong>Controls:</strong></p>
        <p>Left click + drag: Rotate</p>
        <p>Right click + drag: Pan</p>
        <p>Scroll: Zoom</p>
        <p id="stats"></p>
    </div>
    <div id="loading">
        <div class="spinner"></div>
        Loading model...
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        let camera, scene, renderer, controls;

        init();

        function init() {
            const container = document.getElementById('container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 30);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = true;
            controls.minDistance = 1;
            controls.maxDistance = 200;

            // Load model
            loadModel();

            // Handle resize
            window.addEventListener('resize', onWindowResize);

            // Start animation loop
            animate();
        }

        function loadModel() {
            const mtlLoader = new MTLLoader();

            mtlLoader.load('breakfast_room.mtl',
                (materials) => {
                    materials.preload();

                    const objLoader = new OBJLoader();
                    objLoader.setMaterials(materials);

                    objLoader.load('breakfast_room.obj',
                        (object) => {
                            onModelLoaded(object);
                        },
                        (xhr) => {
                            if (xhr.lengthComputable) {
                                const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                                document.getElementById('loading').innerHTML =
                                    `<div class="spinner"></div>Loading model... ${percent}%`;
                            }
                        },
                        (error) => {
                            console.error('Error loading OBJ:', error);
                            document.getElementById('loading').textContent = 'Error loading model';
                        }
                    );
                },
                undefined,
                (error) => {
                    console.warn('MTL load failed, loading OBJ without materials:', error);
                    // Fall back to loading OBJ without materials
                    const objLoader = new OBJLoader();
                    objLoader.load('breakfast_room.obj',
                        (object) => {
                            // Apply default material
                            object.traverse((child) => {
                                if (child.isMesh) {
                                    child.material = new THREE.MeshStandardMaterial({
                                        color: 0xcccccc,
                                        roughness: 0.7,
                                        metalness: 0.0
                                    });
                                }
                            });
                            onModelLoaded(object);
                        },
                        (xhr) => {
                            if (xhr.lengthComputable) {
                                const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                                document.getElementById('loading').innerHTML =
                                    `<div class="spinner"></div>Loading model... ${percent}%`;
                            }
                        },
                        (error) => {
                            console.error('Error loading OBJ:', error);
                            document.getElementById('loading').textContent = 'Error loading model';
                        }
                    );
                }
            );
        }

        function onModelLoaded(object) {
            // Hide loading indicator
            document.getElementById('loading').style.display = 'none';

            // Compute bounding box
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            // Center the model
            object.position.sub(center);
            scene.add(object);

            // Position camera INSIDE the room
            // After centering, the room spans roughly:
            // x: -6 to 6, y: -5 to 5, z: -7.5 to 7.5
            // Place camera at eye level, towards one corner, looking at center
            const eyeLevel = -size.y * 0.2;  // Slightly above floor (floor is at -size.y/2)
            camera.position.set(size.x * 0.3, eyeLevel, size.z * 0.3);

            // Look towards the opposite side of the room
            const lookTarget = new THREE.Vector3(-size.x * 0.1, eyeLevel * 0.5, -size.z * 0.2);
            camera.lookAt(lookTarget);

            controls.target.copy(lookTarget);
            controls.update();

            // Update stats
            let vertexCount = 0;
            let faceCount = 0;
            object.traverse((child) => {
                if (child.isMesh && child.geometry) {
                    const geo = child.geometry;
                    if (geo.attributes.position) {
                        vertexCount += geo.attributes.position.count;
                    }
                    if (geo.index) {
                        faceCount += geo.index.count / 3;
                    } else if (geo.attributes.position) {
                        faceCount += geo.attributes.position.count / 3;
                    }
                }
            });

            document.getElementById('stats').innerHTML =
                `<br><strong>Model stats:</strong><br>` +
                `Vertices: ${vertexCount.toLocaleString()}<br>` +
                `Faces: ${Math.round(faceCount).toLocaleString()}`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
